name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Tipos (tsc)
        run: npm run lint

      - name: Testes
        env:
          GABARITO_CHAVE: ${{ secrets.GABARITO_CHAVE }}
        run: |
          if [ -n "$GABARITO_CHAVE" ]; then
            npm test
          else
            echo "::warning::GABARITO_CHAVE não configurada no GitHub: 15 arquivos de teste que dependem do gabarito foram pulados."
            npm run test:sem-chave
          fi

      - name: Build project
        run: npm run build

      - name: Publish to gh-pages branch (Pages source = branch gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
