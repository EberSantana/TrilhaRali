name: Verificar

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install --legacy-peer-deps
      - name: Tipos (tsc)
        run: npm run lint
      - name: Testes
        env:
          GABARITO_CHAVE: ${{ secrets.GABARITO_CHAVE }}
        run: |
          if [ -n "$GABARITO_CHAVE" ]; then
            npm test
          else
            echo "::warning::GABARITO_CHAVE não configurada no GitHub: 15 arquivos de teste que dependem do gabarito foram pulados."
            npm run test:sem-chave
          fi
      - name: Build
        run: npm run build
